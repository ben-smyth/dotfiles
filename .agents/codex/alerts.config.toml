# Use a real macOS sound instead of relying on the terminal audible bell.
notify = ["/bin/sh", "-c", "nohup /usr/bin/afplay /System/Library/Sounds/Ping.aiff >/dev/null 2>&1 &"]
service_tier = "fast"

[tui]
# Alert when Codex finishes a turn or needs approval.
notifications = ["agent-turn-complete", "approval-requested"]
notification_condition = "always"

